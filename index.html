  <div class="col panel panel-left">
    <h2>蓝图信息</h2>
    <div class="scroll-y">
      <div class="stat-grid" id="stats"><div class="stat-box">请输入蓝图字符串并点击解析</div></div>
    </div>
  </div>
  <div class="col panel panel-center">
    <h2>蓝图预览</h2>
    <div class="canvas-container"><canvas id="canvas3d"></canvas></div>
  </div>
  <div class="col panel panel-right">
    <div id="powerPanel" class="power-panel">
      <div class="power-main">⚡ <span id="powerMain">0 W</span></div>
    </div>
    <div>
      <div id="menuButton" class="menu-header collapsed"><span class="arrow">▼</span>设置</div>
      <div id="powerMenu" class="menu-div collapsed">
        <div class="menu">
          <span id="radiusLabel" class="hidden">半径</span> <input type="number" id="shellRadiusInput" value="10000" step="100" min="4000" class="input-dark hidden w-80">
          光度系数 <input type="number" id="luminosityInput" value="1.0" step="0.1" min="0.1" class="input-dark w-70">
        </div>
        <div class="menu">
          <span>发电量计算:</span>
          <label>
            <input id="isNode" type="checkbox" checked> 节点
          </label>
          <label>
            <input id="isFrame" type="checkbox" checked> 框架
          </label>
          <label>
            <input id="isFaces" type="checkbox" checked> 壳面
          </label>
        </div>
        <div class="menu">
          显示:
          <label>
            <input type="checkbox" id="gridToggle" checked>
            刻度
          </label>
          <label>
            <input type="checkbox" id="rotateToggle" checked>
            旋转
          </label>
          <select id="speedSelect" class="speed-select">
            <option value="0.01">慢</option>
            <option value="0.05" selected>中</option>
            <option value="0.20">快</option>
          </select>
        </div>
      </div>
    </div>
    <div class="input-group">
      <div class="input-header">
        <span>蓝图输入</span>
        <div class="btn-group">
          <button id="parseButton" class="btn-sm">解析并预览</button>
          <button id="pasteButton" class="btn-sm">粘贴</button>
          <button id="copyButton" class="btn-sm">复制</button>
        </div>
      </div>
      <div class="textarea-wrapper">
        <textarea id="blueprintInput" placeholder="粘贴以 DYBP: 开头的蓝图字符串&#10;或拖动蓝图文件到此处"></textarea>
        <div class="drop-hint" id="dropHint">📂 释放文件以加载蓝图</div>
      </div>
    </div>
  </div>
</div>
